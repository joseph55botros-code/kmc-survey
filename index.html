<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استبيان رضا الزبائن - مركز KMC للتجميل</title>
<meta name="theme-color" content="#8E2C4E">
<style>
:root{
  --brand:#8E2C4E;
  --brand-soft:#F3E6EB;
  --bg:#F7F5F6;
  --card:#FFFFFF;
  --ink:#241C22;
  --muted:#7A6B72;
  --line:#E7DDE1;
  --ok:#2E7D5B;
  --warn:#B8791F;
  --bad:#B23A48;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic","Droid Arabic Kufi",Arial,sans-serif;
  font-size:16px;line-height:1.7;
}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 40px}
header{background:var(--brand);color:#fff;padding:16px 14px 14px}
.hdr{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-direction:row-reverse}
.brand{text-align:right}
.brand b{display:block;font-size:19px;letter-spacing:.5px}
.brand span{display:block;font-size:12.5px;opacity:.9}
.logo{width:46px;height:46px;border:2px solid rgba(255,255,255,.75);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;cursor:pointer;user-select:none;background:#fff;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;padding:4px;box-sizing:border-box}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:16px 0 6px}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.stepline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:17px;color:var(--brand)}
.card p.sub{margin:0 0 14px;font-size:13.5px;color:var(--muted)}
.q{margin-bottom:20px}
.q:last-child{margin-bottom:4px}
.q label.t{display:block;font-weight:600;font-size:15px;margin-bottom:9px}
.req:after{content:" *";color:var(--bad)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font:inherit;font-size:14.5px;color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--brand)}
.opt.on{background:var(--brand);border-color:var(--brand);color:#fff}
textarea,input[type=text],input[type=tel],input[type=password],select{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink)
}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,select:focus,.opt:focus,button:focus{outline:2px solid var(--brand);outline-offset:1px}
.stars{display:flex;gap:6px;flex-direction:row-reverse;justify-content:flex-end}
.star{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:21px;line-height:1;cursor:pointer;color:#D9CDD2;padding:0}
.star.on{color:#fff;background:var(--brand);border-color:var(--brand)}
.starhint{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:18px}
.scale5{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.sc5{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;min-width:80px;text-align:center}
.sc5:hover{border-color:var(--brand)}
.sc5.on{background:var(--brand);border-color:var(--brand);color:#fff}
.nps{display:flex;flex-wrap:wrap;gap:6px;flex-direction:row-reverse;justify-content:flex-end}
.nps button{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:9px;font:inherit;font-size:15px;cursor:pointer;padding:0;color:var(--ink)}
.nps button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.npsends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.nav{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;padding:13px;border-radius:11px;border:1px solid var(--brand);background:var(--brand);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.btn.ghost{background:#fff;color:var(--brand)}
.btn.sm{flex:none;padding:9px 14px;font-size:14px;font-weight:500}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.err{background:#FDECEE;border:1px solid #F3C9CE;color:var(--bad);padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:12px;display:none}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
footer{text-align:center;font-size:12.5px;color:var(--muted);padding:18px 12px 26px;line-height:1.9}
.thanks{text-align:center;padding:34px 18px}
.thanks .tick{width:74px;height:74px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:38px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.thanks h2{margin:0 0 8px;color:var(--brand);font-size:21px}
.thanks p{margin:0 0 6px;color:var(--muted);font-size:15px}
.hotline-box{background:var(--brand-soft);border:1px solid var(--brand);border-radius:12px;padding:14px 16px;margin:18px 0;text-align:center}
.hotline-box p{margin:0;color:var(--ink);font-size:15px}
.hotline-box strong{color:var(--brand);font-size:17px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px}
.kpi b{display:block;font-size:24px;color:var(--brand);line-height:1.3}
.kpi span{font-size:12.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--brand-soft);color:var(--brand);padding:9px 10px;text-align:right;font-weight:600}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr:nth-child(even) td{background:#faf8f9}
.badge{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
.badge.g{background:#D6EFE4;color:var(--ok)}
.badge.w{background:#FEF3E2;color:var(--warn)}
.badge.b{background:#FDECEE;color:var(--bad)}
.bar2{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin:3px 0}
.bar2 i{display:block;height:100%;background:var(--brand);border-radius:99px}
.hide{display:none!important}
.section-gate{background:var(--brand-soft);border:1px solid var(--brand);border-radius:var(--r);padding:16px;margin-bottom:14px}
</style>
</head>
<body>
<header>
<div class="hdr">
  <div class="brand">
    <b>مركز KMC للتجميل</b>
    <span>استبيان رضا الزبائن</span>
  </div>
  <div class="logo" id="adminBtn" title="لوحة الإدارة">KMC</div>
</div>
</header>

<div class="wrap">
  <div class="bar"><i id="prog"></i></div>
  <div class="stepline"><span id="stepName"></span><span id="stepCount"></span></div>
  <div id="main"></div>
</div>

<footer>
  مركز KMC للتجميل &nbsp;|&nbsp; جميع المعلومات سرية
</footer>

<script>
var CFG={
  branches:["الفرع الرئيسي","فرع المزة","فرع المالكي","فرع أخرى"],
  channels:["صديقة أو معارف","إنستغرام","فيسبوك","غوغل","تيك توك","أخرى"],
  services:[
    "ليزر إزالة الشعر","عناية وتنظيف بشرة","عيادة جلدية",
    "عيادة جراحة تجميلية","عيادة أذنية","عيادة تغذية",
    "فيلر / بوتوكس","ميزوثيرابي / نضارة","علاج تساقط الشعر",
    "تخسيس وتنحيف","خدمة أخرى"
  ],
  liked:["جودة الخدمة","نظافة المركز","تعامل الفريق","الأسعار","سرعة الخدمة","المظهر العام"],
  improve:["الأسعار","أوقات العمل","التواصل والحجز","سرعة الخدمة","تنوع الخدمات","التوضيح قبل الجلسة"],
  wanted:["عيادة جلدية متخصصة","جلسات تقشير كيميائي","مساج استرخاء","خدمة التوصيل للمنزل","عروض وباقات"],
  scale5:["غير راضٍ","مقبول","جيد","جيد جداً","ممتاز"],
  starHints:["سيئة","مقبولة","جيدة","جيدة جداً","ممتازة"],
  API:""
};

var A={
  first:"",channel:"",services:[],
  recPhone:"",recWelcome:"",recApptPrecision:"",recClean:"",
  booking:"",apptSatisfied:"",apptHonored:"",
  hasLaser:"",laserApptContact:"",laserApptOnTime:"",laserBedClean:"",
  laserDeviceClean:"",laserExpertise:"",laserCare:"",laserResult:"",laserComfort:"",
  hasCosmeticSurgery:"",cosResult:"",cosClinicAtmo:"",cosDisinfection:"",cosNursing:"",cosProcedureNote:"",
  nps:null,again:"",liked:[],improve:[],wanted:[],
  problem:"",problemTxt:"",note:"",name:"",phone:"",contactOk:""
};

var STEP=0;
var STEPS=[
  {name:"التعارف",                   build:stepA},
  {name:"تقييم الاستقبال",           build:stepB},
  {name:"الحجز والمواعيد",           build:stepC},
  {name:"قسم الليزر",                build:stepD},
  {name:"عيادة الجراحة التجميلية",   build:stepE},
  {name:"رضاكِ العام واقتراحاتك",     build:stepF}
];

/* helpers */
function el(tag,cls,txt){
  var e=document.createElement(tag);
  if(cls)e.className=cls;
  if(txt!=null)e.textContent=txt;
  return e;
}
function qBox(title,req){
  var d=el("div","q");
  var lb=el("label","t",title);
  if(req)lb.classList.add("req");
  d.appendChild(lb);
  return d;
}
function single(title,req,opts,field,cb){
  var q=qBox(title,req), box=el("div","opts");
  opts.forEach(function(o){
    var b=el("button","opt",o); b.type="button";
    if(A[field]===o)b.classList.add("on");
    b.onclick=function(){
      A[field]=o;
      [].forEach.call(box.children,function(c){c.classList.remove("on")});
      b.classList.add("on");
      if(cb)cb(o);
    };
    box.appendChild(b);
  });
  q.appendChild(box); return q;
}
function multi(title,req,opts,field){
  var q=qBox(title,req), box=el("div","opts");
  opts.forEach(function(o){
    var b=el("button","opt",o); b.type="button";
    if(A[field].indexOf(o)>-1)b.classList.add("on");
    b.onclick=function(){
      var idx=A[field].indexOf(o);
      if(idx>-1){A[field].splice(idx,1);b.classList.remove("on");}
      else{A[field].push(o);b.classList.add("on");}
    };
    box.appendChild(b);
  });
  q.appendChild(box); return q;
}
function scale5q(title,req,field){
  var q=qBox(title,req), box=el("div","scale5");
  CFG.scale5.forEach(function(v,i){
    var val=i+1;
    var b=el("button","sc5",v); b.type="button";
    if(A[field]===val)b.classList.add("on");
    b.onclick=function(){
      A[field]=val;
      [].forEach.call(box.children,function(c){c.classList.remove("on")});
      b.classList.add("on");
    };
    box.appendChild(b);
  });
  q.appendChild(box); return q;
}
function textq(title,req,field,ph,multi_){
  var q=qBox(title,req);
  var inp=el(multi_?"textarea":"input");
  if(!multi_)inp.type="text";
  inp.placeholder=ph||"";
  inp.value=A[field]||"";
  inp.oninput=function(){A[field]=inp.value.trim()};
  q.appendChild(inp); return q;
}
function starsQ(title,req,field){
  var q=qBox(title,req);
  var wrap=el("div","stars");
  var hint=el("div","starhint","");
  for(var i=5;i>=1;i--){
    (function(v){
      var b=el("button","star","★"); b.type="button";
      if(A[field]===v)b.classList.add("on");
      b.onclick=function(){
        A[field]=v;
        hint.textContent=CFG.starHints[v-1];
        [].forEach.call(wrap.children,function(c,ci){
          c.classList.toggle("on", (5-ci)<=v);
        });
      };
      wrap.appendChild(b);
    })(i);
  }
  if(A[field]){hint.textContent=CFG.starHints[A[field]-1];}
  q.appendChild(wrap); q.appendChild(hint); return q;
}

/* ========== STEP A: التعارف ========== */
function stepA(){
  var d=document.createDocumentFragment();
  var c=el("div","card");
  c.innerHTML='<h2>مرحباً بكِ 💐</h2><p class="sub">لا تترددي في إعلامنا برأيكِ بصراحة — كلامكِ يساعدنا نكون أحسن دائماً</p>';

  c.appendChild(single("هل هذه زيارتكِ الأولى؟",true,["نعم، زيارتي الأولى","لا، زبونة قديمة"],"first"));
  c.appendChild(single("كيف سمعتِ عنّا؟",false,CFG.channels,"channel"));
  c.appendChild(multi("ما الخدمات التي حصلتِ عليها اليوم؟",true,CFG.services,"services"));
  d.appendChild(c);
  return d;
}

/* ========== STEP B: الاستقبال ========== */
function stepB(){
  var d=document.createDocumentFragment();
  var c=el("div","card");
  c.innerHTML='<h2>تقييم الاستقبال</h2><p class="sub">قيّمي تجربتكِ مع الاستقبال بصدق</p>';
  c.appendChild(scale5q("الرد على الهاتف عند الاتصال للحجز",true,"recPhone"));
  c.appendChild(scale5q("الترحيب باستقبالكِ عند الوصول",true,"recWelcome"));
  c.appendChild(scale5q("دقة موعدكِ (الالتزام بالوقت المحدد)",true,"recApptPrecision"));
  c.appendChild(scale5q("نظافة منطقة الاستقبال والانتظار",true,"recClean"));
  d.appendChild(c);
  return d;
}

/* ========== STEP C: الحجز والمواعيد ========== */
function stepC(){
  var d=document.createDocumentFragment();
  var c=el("div","card");
  c.innerHTML='<h2>الحجز والمواعيد</h2><p class="sub">أخبرينا عن طريقة حجزكِ ومدى رضاكِ</p>';
  c.appendChild(single("كيف حجزتِ موعدكِ؟",true,
    ["عبر الهاتف","واتساب","إنستغرام","الحضور المباشر","أخرى"],"booking"));
  c.appendChild(single("هل كنتِ راضية عن عملية الحجز؟",true,
    ["نعم، سهلة وسلسة","مقبول","صعبة وتحتاج تحسين"],"apptSatisfied"));
  c.appendChild(single("هل التزمنا بالموعد المحدد لكِ؟",true,
    ["نعم، تماماً","تأخر بسيط مقبول","تأخر كبير"],"apptHonored"));
  d.appendChild(c);
  return d;
}

/* ========== STEP D: قسم الليزر ========== */
function stepD(){
  var d=document.createDocumentFragment();

  var gateCard=el("div","section-gate");
  gateCard.innerHTML='<h2>قسم الليزر ✨</h2>';

  var laserSection=el("div","");
  laserSection.id="laserSection";
  if(A.hasLaser==="لا")laserSection.classList.add("hide");

  var gateQ=single("هل أجريتِ جلسة ليزر في هذه الزيارة؟",true,["نعم","لا"],"hasLaser",function(v){
    laserSection.classList.toggle("hide",v==="لا");
  });
  gateCard.appendChild(gateQ);
  d.appendChild(gateCard);

  var c=el("div","card");
  laserSection.appendChild(single("هل تم التواصل معكِ قبل الجلسة لتذكيركِ وإعطائكِ التعليمات؟",false,["نعم","لا"],"laserApptContact"));
  laserSection.appendChild(scale5q("دقة موعد الجلسة (الالتزام بالوقت)",false,"laserApptOnTime"));
  laserSection.appendChild(scale5q("نظافة السرير وأغطية الجلسة",false,"laserBedClean"));
  laserSection.appendChild(scale5q("نظافة وتعقيم جهاز الليزر",false,"laserDeviceClean"));
  laserSection.appendChild(scale5q("خبرة وكفاءة المختصة التي أجرت الجلسة",false,"laserExpertise"));
  laserSection.appendChild(scale5q("اهتمام المختصة بكِ وأسلوب تعاملها",false,"laserCare"));
  laserSection.appendChild(scale5q("نتيجة الجلسة حتى الآن",false,"laserResult"));
  laserSection.appendChild(scale5q("مستوى الراحة خلال الجلسة",false,"laserComfort"));
  c.appendChild(laserSection);
  d.appendChild(c);
  return d;
}

/* ========== STEP E: الجراحة التجميلية ========== */
function stepE(){
  var d=document.createDocumentFragment();

  var gateCard=el("div","section-gate");
  gateCard.innerHTML='<h2>عيادة الجراحة التجميلية 🏥</h2>';

  var cosSection=el("div","");
  cosSection.id="cosSection";
  if(A.hasCosmeticSurgery==="لا")cosSection.classList.add("hide");

  var gateQ=single("هل أجريتِ إجراءً في عيادة الجراحة التجميلية؟",true,["نعم","لا"],"hasCosmeticSurgery",function(v){
    cosSection.classList.toggle("hide",v==="لا");
  });
  gateCard.appendChild(gateQ);
  d.appendChild(gateCard);

  var c=el("div","card");
  cosSection.appendChild(scale5q("نتيجة الإجراء الذي أجريتِه",false,"cosResult"));
  cosSection.appendChild(scale5q("أجواء العيادة (الراحة والاطمئنان)",false,"cosClinicAtmo"));
  cosSection.appendChild(scale5q("مستوى التعقيم والتعامل مع المعدات",false,"cosDisinfection"));
  cosSection.appendChild(scale5q("خدمة التمريض والرعاية خلال الإجراء",false,"cosNursing"));
  cosSection.appendChild(textq("ملاحظاتكِ على الإجراء أو العيادة (اختياري)",false,"cosProcedureNote","أي ملاحظة تودّين إضافتها...",true));
  c.appendChild(cosSection);
  d.appendChild(c);
  return d;
}

/* ========== STEP F: الرضا العام ========== */
function stepF(){
  var d=document.createDocumentFragment();
  var c1=el("div","card");
  c1.innerHTML='<h2>رضاكِ العام 🌟</h2><p class="sub">رأيكِ الصريح يهمّنا جداً</p>';

  /* NPS */
  var npsQ=qBox("كم احتمال أنكِ ستوصين بنا لصديقة أو قريبة؟ (0 = لا أبداً، 10 = بكل تأكيد)",true);
  var npsRow=el("div","nps");
  for(var i=10;i>=0;i--){
    (function(v){
      var b=el("button","",String(v)); b.type="button";
      if(A.nps===v)b.classList.add("on");
      b.onclick=function(){
        A.nps=v;
        [].forEach.call(npsRow.children,function(c){c.classList.remove("on")});
        b.classList.add("on");
      };
      npsRow.appendChild(b);
    })(i);
  }
  var npsEnds=el("div","npsends");
  npsEnds.innerHTML='<span>لن أوصي</span><span>سأوصي بشدة</span>';
  npsQ.appendChild(npsRow); npsQ.appendChild(npsEnds);
  c1.appendChild(npsQ);
  c1.appendChild(single("هل ستعودين إلينا مرة أخرى؟",true,["بالتأكيد","ربما","لا أعتقد"],"again"));
  c1.appendChild(multi("ما الذي أعجبكِ أكثر؟",false,CFG.liked,"liked"));
  c1.appendChild(multi("ما الذي تودّين تحسينه؟",false,CFG.improve,"improve"));
  c1.appendChild(multi("خدمات تودّين رؤيتها عندنا مستقبلاً؟",false,CFG.wanted,"wanted"));
  d.appendChild(c1);

  var c2=el("div","card");
  c2.innerHTML='<h2>مشكلة أو شكوى</h2>';
  c2.appendChild(single("هل واجهتِ أي مشكلة اليوم؟",false,["نعم","لا"],"problem",function(v){
    ptxt.style.display=v==="نعم"?"block":"none";
  }));
  var ptxt=el("div","");
  ptxt.style.display=A.problem==="نعم"?"block":"none";
  ptxt.appendChild(textq("يرجى وصف المشكلة",false,"problemTxt","اشرحي المشكلة بإيجاز...",true));
  c2.appendChild(ptxt);
  c2.appendChild(textq("ملاحظة عامة أو اقتراح",false,"note","أي شيء إضافي تودّين قوله...",true));
  d.appendChild(c2);

  var c3=el("div","card");

/* ========== Navigation & Validation ========== */
function valid(){
  if(STEP===0){
    if(!A.first){alert("يرجى الإجابة على سؤال الزيارة الأولى"); return false;}
    if(!A.services.length){alert("يرجى تحديد الخدمات التي حصلتِ عليها"); return false;}
  }
  if(STEP===1){
    if(!A.recPhone){alert("يرجى تقييم الرد على الهاتف"); return false;}
    if(!A.recWelcome){alert("يرجى تقييم الترحيب"); return false;}
    if(!A.recApptPrecision){alert("يرجى تقييم دقة الموعد"); return false;}
    if(!A.recClean){alert("يرجى تقييم نظافة الاستقبال"); return false;}
  }
  if(STEP===2){
    if(!A.booking){alert("يرجى تحديد طريقة الحجز"); return false;}
    if(!A.apptSatisfied){alert("يرجى تقييم عملية الحجز"); return false;}
    if(!A.apptHonored){alert("يرجى الإجابة عن الالتزام بالموعد"); return false;}
  }
  if(STEP===3){
    if(!A.hasLaser){alert("يرجى الإجابة على سؤال جلسة الليزر"); return false;}
  }
  if(STEP===4){
    if(!A.hasCosmeticSurgery){alert("يرجى الإجابة على سؤال عيادة الجراحة التجميلية"); return false;}
  }
  if(STEP===5){
    if(A.nps===null){alert("يرجى تحديد احتمال التوصية (NPS)"); return false;}
    if(!A.again){alert("يرجى الإجابة على سؤال العودة"); return false;}
  }
  return true;
}

function render(){
  var main=document.getElementById("main");
  main.innerHTML="";

  if(STEP>=STEPS.length){
    showThanks(); return;
  }

  var frag=STEPS[STEP].build();
  main.appendChild(frag);

  var errDiv=el("div","err"); errDiv.id="errMsg";
  main.appendChild(errDiv);

  var nav=el("div","nav");
  if(STEP>0){
    var back=el("button","btn ghost","السابق"); back.type="button";
    back.onclick=function(){STEP--;render();};
    nav.appendChild(back);
  }

  var isLast=STEP===STEPS.length-1;
  var next=el("button","btn",isLast?"إرسال الاستبيان ✓":"التالي"); next.type="button";
  next.onclick=function(){
    if(!valid())return;
    if(isLast){submit();}
    else{STEP++;render();}
  };
  nav.appendChild(next);
  main.appendChild(nav);

  var prog=document.getElementById("prog");
  prog.style.width=((STEP/(STEPS.length-1))*100)+"%";
  document.getElementById("stepName").textContent=STEPS[STEP].name;
  document.getElementById("stepCount").textContent="الخطوة "+(STEP+1)+" من "+STEPS.length;
  window.scrollTo(0,0);
}

function showThanks(){
  var main=document.getElementById("main");
  main.innerHTML='';
  var d=el("div","thanks");
  d.innerHTML='<div class="tick">✓</div><h2>شكراً جزيلاً! 💖</h2>'+
    '<p>رأيكِ يساعدنا على تقديم أفضل خدمة دائماً</p>'+
    '<p>نتطلع إلى رؤيتكِ قريباً في مركز KMC</p>'+
    '<div class="hotline-box"><p>هل لديكِ شكوى عاجلة؟</p>'+
    '<p>تواصلي مع الإدارة مباشرة على الرقم: <strong>0988380358</strong></p></div>';
  main.appendChild(d);

  document.getElementById("stepName").textContent="تم الإرسال";
  document.getElementById("stepCount").textContent="";
}

/* ========== Storage & Submit ========== */
var STORE_KEY="kmc_survey_v2";
function loadStore(){
  try{return JSON.parse(localStorage.getItem(STORE_KEY)||"[]");}catch(e){return [];}
}
function saveStore(arr){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(arr));}catch(e){}
}
function submit(){
  var rec=JSON.parse(JSON.stringify(A));
  rec.ts=new Date().toISOString();
  rec.id="S"+Date.now();
  var arr=loadStore(); arr.push(rec); saveStore(arr);
  if(CFG.API){
    fetch(CFG.API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(rec)})
    .catch(function(){});
  }
  STEP=STEPS.length;
  render();
}

function avg(arr){
  var v=arr.filter(function(x){return x!=null&&x!==''});
  if(!v.length)return null;
  return v.reduce(function(a,b){return a+b;},0)/v.length;
}
function pct(arr,val){
  if(!arr.length)return 0;
  return Math.round(arr.filter(function(x){return x===val;}).length/arr.length*100);
}
function fmtAvg(v){ return v==null?"—":(+v).toFixed(1)+"/5"; }
function badge(v){
  if(v==null)return '<span class="badge w">—</span>';
  if(v>=4)return '<span class="badge g">'+v.toFixed(1)+'</span>';
  if(v>=3)return '<span class="badge w">'+v.toFixed(1)+'</span>';
  return '<span class="badge b">'+v.toFixed(1)+'</span>';
}
function overallScore(rec){
  var v=[];
  ["recWelcome","recApptPrecision","recClean"].forEach(function(k){if(rec[k])v.push(rec[k]);});
  if(rec.hasLaser==="نعم"){
    ["laserApptOnTime","laserBedClean","laserDeviceClean","laserExpertise","laserCare","laserResult"]
    .forEach(function(k){if(rec[k])v.push(rec[k]);});
  }
  if(rec.hasCosmeticSurgery==="نعم"){
    ["cosResult","cosClinicAtmo","cosDisinfection","cosNursing"]
    .forEach(function(k){if(rec[k])v.push(rec[k]);});
  }
  return avg(v);
}
function npsLabel(n){
  if(n>=9)return "مروّج";
  if(n>=7)return "محايد";
  return "ناقد";
}
function calcNPS(data){
  var arr=data.filter(function(r){return r.nps!=null;});
  if(!arr.length)return null;
  var pro=arr.filter(function(r){return r.nps>=9;}).length;
  var det=arr.filter(function(r){return r.nps<=6;}).length;
  return Math.round((pro-det)/arr.length*100);
}

function kpiCard(label,val){

    lt.innerHTML='<tr><th>البند</th><th>العدد</th></tr>';

function exportCSV(data){
  if(!data.length){alert("لا توجد بيانات");return;}
  var keys=Object.keys(data[0]);
  var rows=[keys.join(",")];
  data.forEach(function(r){
    rows.push(keys.map(function(k){
      var v=Array.isArray(r[k])?r[k].join("|"):r[k];
      return '"'+(String(v==null?"":v).replace(/"/g,'""'))+'"';
    }).join(","));
  });
  var blob=new Blob(["﻿"+rows.join("\n")],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="kmc_survey_"+new Date().toISOString().slice(0,10)+".csv";
  a.click();
}
function exportJSON(data){
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="kmc_survey_"+new Date().toISOString().slice(0,10)+".json";
  a.click();
}

/* load saved config */
try{var sc=JSON.parse(localStorage.getItem("kmc_cfg")||"{}");if(sc.API)CFG.API=sc.API;}catch(e){}

/* init */
render();
