.hdr{position:relative;z-index:1}
.hdr{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-direction:row-reverse}
.brand{text-align:right}
.brand b{display:block;font-size:19px;letter-spacing:.5px}
.brand span{display:block;font-size:12.5px;opacity:.9}
.logo{width:46px;height:46px;border:2px solid rgba(255,255,255,.75);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;cursor:pointer;user-select:none;background:#fff;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;padding:0;box-sizing:border-box;border-radius:50%;}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:16px 0 6px}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.stepline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:17px;color:var(--brand)}
.card p.sub{margin:0 0 14px;font-size:13.5px;color:var(--muted)}
.q{margin-bottom:20px}
.q:last-child{margin-bottom:4px}
.q label.t{display:block;font-weight:600;font-size:15px;margin-bottom:9px}
.req:after{content:" *";color:var(--bad)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font:inherit;font-size:14.5px;color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--brand)}
.opt.on{background:var(--brand);border-color:var(--brand);color:#fff}
textarea,input[type=text],input[type=tel],input[type=password],select{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink)
}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,select:focus,.opt:focus,button:focus{outline:2px solid var(--brand);outline-offset:1px}
.stars{display:flex;gap:6px;flex-direction:row-reverse;justify-content:flex-end}
.star{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:21px;line-height:1;cursor:pointer;color:#D9CDD2;padding:0}
.star.on{color:#fff;background:var(--brand);border-color:var(--brand)}
.starhint{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:18px}
.scale5{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.sc5{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;min-width:80px;text-align:center}
.sc5:hover{border-color:var(--brand)}
.sc5.on{background:var(--brand);border-color:var(--brand);color:#fff}
.nps{display:flex;flex-wrap:wrap;gap:6px;flex-direction:row-reverse;justify-content:flex-end}
.nps button{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:9px;font:inherit;font-size:15px;cursor:pointer;padding:0;color:var(--ink)}
.nps button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.npsends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.nav{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;padding:13px;border-radius:11px;border:1px solid var(--brand);background:var(--brand);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.btn.ghost{background:#fff;color:var(--brand)}
.btn.sm{flex:none;padding:9px 14px;font-size:14px;font-weight:500}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.err{background:#FDECEE;border:1px solid #F3C9CE;color:var(--bad);padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:12px;display:none}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
footer{text-align:center;font-size:12.5px;color:var(--muted);padding:18px 12px 26px;line-height:1.9}
.thanks{text-align:center;padding:34px 18px}
.thanks .tick{width:74px;height:74px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:38px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.thanks h2{margin:0 0 8px;color:var(--brand);font-size:21px}
.thanks p{margin:0 0 6px;color:var(--muted);font-size:15px}
.hotline-box{background:var(--brand-soft);border:1px solid var(--brand);border-radius:12px;padding:14px 16px;margin:18px 0;text-align:center}
.hotline-box p{margin:0;color:var(--ink);font-size:15px}
.hotline-box strong{color:var(--brand);font-size:17px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px}
.kpi b{display:block;font-size:24px;color:var(--brand);line-height:1.3}
.kpi span{font-size:12.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--brand-soft);color:var(--brand);padding:9px 10px;text-align:right;font-weight:600}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr:nth-child(even) td{background:#faf8f9}
.badge{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
.badge.g{background:#D6EFE4;color:var(--ok)}
.badge.w{background:#FEF3E2;color:var(--warn)}
.badge.b{background:#FDECEE;color:var(--bad)}
.bar2{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin:3px 0}
.bar2 i{display:block;height:100%;background:var(--brand);border-radius:99px}
.hide{display:none!important}
.q.missing{background:#FDECEE;border-radius:10px;padding:8px;margin-right:-8px;margin-left:-8px;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.err{display:none}
.section-gate{background:var(--brand-soft);border:1px solid var(--brand);border-radius:var(--r);padding:16px;margin-bottom:14px}
</style>
</head>

/* helpers */
function el(tag,cls,txt){
  var e=document.createElement(tag);
  if(cls)e.className=cls;
  if(txt!=null)e.textContent=txt;
  return e;
}
function qBox(title,req){
  var d=el("div","q");
  var lb=el("label","t",title);
  if(req)lb.classList.add("req");
  d.appendChild(lb);
  return d;
}
function single(title,req,opts,field,cb){
  var q=qBox(title,req), box=el("div","opts"); q.dataset.f=field;
  opts.forEach(function(o){
    var b=el("button","opt",o); b.type="button";
    if(A[field]===o)b.classList.add("on");
    b.onclick=function(){
      A[field]=o;
      [].forEach.call(box.children,function(c){c.classList.remove("on")});
      b.classList.add("on");
      q.classList.remove("missing");
      if(cb)cb(o);
    };
    box.appendChild(b);
  });
  q.appendChild(box); return q;
}
function multi(title,req,opts,field,cb){
  var q=qBox(title,req), box=el("div","opts"); q.dataset.f=field;
  opts.forEach(function(o){
    var b=el("button","opt",o); b.type="button";
    if(A[field].indexOf(o)>-1)b.classList.add("on");
    b.onclick=function(){
      var idx=A[field].indexOf(o);
      if(idx>-1){A[field].splice(idx,1);b.classList.remove("on");}
      else{A[field].push(o);b.classList.add("on");}
      q.classList.remove("missing");
      if(cb)cb(A[field]);
    };
    box.appendChild(b);
  });
  q.appendChild(box); return q;
}
function scale5q(title,req,field){
  var q=qBox(title,req), box=el("div","scale5"); q.dataset.f=field;
  CFG.scale5.forEach(function(v,i){
    var val=i+1;
    var b=el("button","sc5",v); b.type="button";
    if(A[field]===val)b.classList.add("on");
    b.onclick=function(){
      A[field]=val;
      [].forEach.call(box.children,function(c){c.classList.remove("on")});
      b.classList.add("on");
      q.classList.remove("missing");
    };
    box.appendChild(b);
  });
  q.appendChild(box); return q;
}
function textq(title,req,field,ph,multi_,type_){
  var q=qBox(title,req); q.dataset.f=field;
  var inp=el(multi_?"textarea":"input");
  if(!multi_){inp.type=type_||"text"; if(type_==="tel"){inp.inputMode="tel";inp.dir="ltr";inp.style.textAlign="right";}}
  inp.placeholder=ph||"";
  inp.value=A[field]||"";
  inp.oninput=function(){A[field]=inp.value.trim();q.classList.remove("missing");};
  q.appendChild(inp); return q;
}
function starsQ(title,req,field){
  var q=qBox(title,req);
  var wrap=el("div","stars");

/* ========== Navigation & Validation ========== */
function fail(msg,field){
  var e=document.getElementById("errMsg");
  if(e){e.textContent=msg;e.style.display="block";}
  var q=field?document.querySelector('[data-f="'+field+'"]'):null;
  if(q){
    q.classList.remove("missing"); void q.offsetWidth; q.classList.add("missing");
    q.scrollIntoView({behavior:"smooth",block:"center"});
  }
  return false;
}
function valid(){
  var rules={
    0:[["first","يرجى الإجابة على سؤال الزيارة الأولى"],["services","يرجى تحديد الخدمات التي حصلتِ عليها"]],
    1:[["recPhone","يرجى تقييم الرد على الهاتف"],["recWelcome","يرجى تقييم الترحيب"],["recApptPrecision","يرجى تقييم دقة الموعد"],["recClean","يرجى تقييم نظافة الاستقبال"]],
    2:[["booking","يرجى تحديد طريقة الحجز"],["apptSatisfied","يرجى تقييم عملية الحجز"],["apptHonored","يرجى الإجابة عن الالتزام بالموعد"]],
    3:[["hasLaser","يرجى الإجابة على سؤال جلسة الليزر"]],
    4:[["hasCosmeticSurgery","يرجى الإجابة على سؤال عيادة الجراحة التجميلية"]],
    5:[["nps","يرجى تحديد احتمال التوصية"],["again","يرجى الإجابة على سؤال العودة"]]
  }[STEP]||[];
  for(var i=0;i<rules.length;i++){
    var f=rules[i][0], v=A[f];
    if(v===null||v===""||(Array.isArray(v)&&!v.length))return fail(rules[i][1],f);
  }
  if(STEP===5){
    if(A.problem==="نعم"&&!A.problemTxt)return fail("يرجى وصف المشكلة باختصار حتى نتمكن من حلّها","problemTxt");
    if(A.phone){
      var ph=A.phone.replace(/[\s\-]/g,"").replace(/^\+?963/,"0");
      if(!/^09\d{8}$/.test(ph))return fail("رقم الهاتف غير صحيح — يجب أن يبدأ بـ 09 ويتكون من 10 أرقام","phone");
      A.phone=ph;
    }
  }
  return true;
}

    var back=el("button","btn ghost","السابق"); back.type="button";
    back.onclick=function(){STEP--;render();};

  }

  var isLast=STEP===STEPS.length-1;
  var next=el("button","btn",isLast?"إرسال الاستبيان ✓":"التالي"); next.type="button";
  next.onclick=function(){

  var prog=document.getElementById("prog");

/* ========== Draft & Reset ========== */
var BLANK=JSON.stringify(A);
var DRAFT_KEY="kmc_survey_draft";
function saveDraft(){
  try{sessionStorage.setItem(DRAFT_KEY,JSON.stringify({A:A,STEP:STEP}));}catch(e){}
}
function loadDraft(){
  try{
    var d=JSON.parse(sessionStorage.getItem(DRAFT_KEY)||"null");
    if(d&&d.A&&d.STEP<STEPS.length){A=Object.assign(JSON.parse(BLANK),d.A);STEP=d.STEP;}
  }catch(e){}
}
var resetTimer=null;
function newSurvey(){
  if(resetTimer){clearTimeout(resetTimer);resetTimer=null;}
  A=JSON.parse(BLANK); STEP=0;
  try{sessionStorage.removeItem(DRAFT_KEY);}catch(e){}
  render();
}

/* ========== Storage & Submit ========== */
var STORE_KEY="kmc_survey_v2";
function loadStore(){
  try{return JSON.parse(localStorage.getItem(STORE_KEY)||"[]");}catch(e){return [];}
}
function saveStore(arr){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(arr));}catch(e){}
}
var submitting=false;
function submit(){
  if(submitting)return; submitting=true;
  var rec=JSON.parse(JSON.stringify(A));
  /* تنظيف إجابات الأقسام غير المعنية */
  if(rec.hasLaser!=="نعم")["laserApptContact","laserApptOnTime","laserBedClean","laserDeviceClean","laserExpertise","laserCare","laserResult","laserComfort"].forEach(function(k){rec[k]="";});
  if(rec.hasCosmeticSurgery!=="نعم")["cosResult","cosClinicAtmo","cosDisinfection","cosNursing","cosProcedureNote"].forEach(function(k){rec[k]="";});
  if(rec.problem!=="نعم")rec.problemTxt="";
  rec.ts=new Date().toISOString();
  rec.id="S"+Date.now();
  var arr=loadStore(); arr.push(rec); saveStore(arr);
  if(CFG.API){
    /* text/plain + no-cors ضروري حتى يقبل Google Apps Script الطلب */
    fetch(CFG.API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)})
    .catch(function(){});
  }
  try{sessionStorage.removeItem(DRAFT_KEY);}catch(e){}
  STEP=STEPS.length;
  render();
  submitting=false;
  resetTimer=setTimeout(newSurvey,60000);
}

function avg(arr){
  var v=arr.filter(function(x){return x!=null&&x!==''});
  if(!v.length)return null;
  return v.reduce(function(a,b){return a+b;},0)/v.length;
}
function pct(arr,val){
  if(!arr.length)return 0;
  return Math.round(arr.filter(function(x){return x===val;}).length/arr.length*100);
}
function fmtAvg(v){ return v==null?"—":(+v).toFixed(1)+"/5"; }
function badge(v){
  if(v==null)return '<span class="badge w">—</span>';
  if(v>=4)return '<span class="badge g">'+v.toFixed(1)+'</span>';
  if(v>=3)return '<span class="badge w">'+v.toFixed(1)+'</span>';
  return '<span class="badge b">'+v.toFixed(1)+'</span>';
}
function overallScore(rec){
  var v=[];
  ["recPhone","recWelcome","recApptPrecision","recClean"].forEach(function(k){if(rec[k])v.push(rec[k]);});
  if(rec.hasLaser==="نعم"){
    ["laserApptOnTime","laserBedClean","laserDeviceClean","laserExpertise","laserCare","laserResult","laserComfort"]
    .forEach(function(k){if(rec[k])v.push(rec[k]);});
  }
  if(rec.hasCosmeticSurgery==="نعم"){
    ["cosResult","cosClinicAtmo","cosDisinfection","cosNursing"]
    .forEach(function(k){if(rec[k])v.push(rec[k]);});
  }
  return avg(v);
}
function npsLabel(n){
  if(n>=9)return "مروّج";
  if(n>=7)return "محايد";
  return "ناقد";
}
function calcNPS(data){
  var arr=data.filter(function(r){return r.nps!=null;});
  if(!arr.length)return null;
  var pro=arr.filter(function(r){return r.nps>=9;}).length;
  var det=arr.filter(function(r){return r.nps<=6;}).length;
  return Math.round((pro-det)/arr.length*100);
}

function countCard(title,data,field,first){
  var c=el("div","card"); if(first)c.style.marginTop="14px";
  c.innerHTML='<h2>'+title+'</h2>';
  var cnt={};
  data.forEach(function(r){
    var v=r[field]; if(!v)return;
    (Array.isArray(v)?v:[v]).forEach(function(x){cnt[x]=(cnt[x]||0)+1;});
  });
  var keys=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];});
  if(!keys.length){c.innerHTML+='<p class="sub">لا توجد بيانات.</p>';return c;}
  var tb=el("table");
  tb.innerHTML='<tr><th>البند</th><th>العدد</th><th style="width:40%">النسبة</th></tr>';
  keys.forEach(function(k){
    var p=Math.round(cnt[k]/data.length*100);
    var tr=el("tr");
    tr.innerHTML='<td></td><td>'+cnt[k]+'</td><td><div class="bar2"><i style="width:'+p+'%"></i></div>'+p+'%</td>';
    tr.firstChild.textContent=k;
    tb.appendChild(tr);
  });
  c.appendChild(tb); return c;
}

  kpis.appendChild(kpiCard("نسبة العودة",pct(data.map(function(r){return r.again;}),"بالتأكيد")+"%"));
  d.appendChild(kpis);

  if(data.length){
    d.appendChild(countCard("الخدمات الأكثر طلباً",data,"services",true));
    d.appendChild(countCard("أبرز ما أعجب الزبائن",data,"liked"));

}

function tabNotes(data){
  var d=el("div","");
  var withNotes=data.filter(function(r){return r.note&&r.note.trim();});
  var withProblems=data.filter(function(r){return r.problem==="نعم"&&r.problemTxt&&r.problemTxt.trim();});

  var c=el("div","card");
  c.innerHTML='<h2>الملاحظات العامة ('+withNotes.length+')</h2>';
  if(!withNotes.length){c.innerHTML+='<p>لا توجد ملاحظات.</p>';}
  else{
    withNotes.forEach(function(r){
      var p=el("p","");
      p.textContent=(r.name||"مجهولة")+" ("+r.ts.slice(0,10)+"): "+r.note;
      c.appendChild(p);
    });
  }
  d.appendChild(c);

  var follow=data.filter(function(r){
    var s=overallScore(r);
    return r.problem==="نعم"||(s!=null&&s<3)||(r.nps!=null&&r.nps<=6)||r.again==="لا أعتقد";
  }).slice().reverse();
  var cf=el("div","card");
  cf.innerHTML='<h2>⚠️ زبونات بحاجة متابعة ('+follow.length+')</h2><p class="sub">شكوى، أو تقييم أقل من 3، أو NPS من 0 إلى 6، أو لا تنوي العودة</p>';
  if(follow.length){
    var ft=el("table");
    ft.innerHTML='<tr><th>التاريخ</th><th>الاسم</th><th>الهاتف</th><th>التقييم</th><th>NPS</th><th>السبب</th></tr>';
    follow.forEach(function(r){
      var s=overallScore(r), why=[];
      if(r.problem==="نعم")why.push("شكوى");
      if(s!=null&&s<3)why.push("تقييم منخفض");
      if(r.nps!=null&&r.nps<=6)why.push("ناقدة");
      if(r.again==="لا أعتقد")why.push("لن تعود");
      var tr=el("tr");
      tr.innerHTML='<td>'+(r.ts?r.ts.slice(0,10):"—")+'</td><td></td><td dir="ltr" style="text-align:right"></td><td>'+badge(s)+'</td><td>'+(r.nps!=null?r.nps:"—")+'</td><td>'+why.join("، ")+'</td>';
      tr.children[1].textContent=r.name||"مجهولة";
      tr.children[2].textContent=r.phone||"—";
      ft.appendChild(tr);
    });
    cf.appendChild(ft);
  } else cf.innerHTML+='<p>لا توجد حالات تستدعي المتابعة 👍</p>';
  d.insertBefore(cf,d.firstChild);

  var c2=el("div","card");
  c2.innerHTML='<h2>الشكاوى المبلّغة ('+withProblems.length+')</h2>';
  if(!withProblems.length){c2.innerHTML+='<p>لا توجد شكاوى.</p>';}
  else{
    withProblems.forEach(function(r){
      var p=el("p","");
      p.style.color="var(--bad)";
      p.textContent=(r.name||"مجهولة")+(r.phone?" ["+r.phone+"]":"")+" ("+r.ts.slice(0,10)+"): "+r.problemTxt;
      c2.appendChild(p);
    });
  }
  d.appendChild(c2);
  return d;
}

function exportCSV(data){
  if(!data.length){alert("لا توجد بيانات");return;}
  var LBL={id:"المعرّف",ts:"التاريخ",first:"زيارة أولى",channel:"مصدر المعرفة",services:"الخدمات",
    recPhone:"الرد على الهاتف",recWelcome:"الترحيب",recApptPrecision:"دقة الموعد",recClean:"نظافة الاستقبال",
    booking:"طريقة الحجز",apptSatisfied:"الرضا عن الحجز",apptHonored:"الالتزام بالموعد",
    hasLaser:"جلسة ليزر",laserApptContact:"ليزر: تواصل مسبق",laserApptOnTime:"ليزر: دقة الموعد",laserBedClean:"ليزر: نظافة السرير",
    laserDeviceClean:"ليزر: تعقيم الجهاز",laserExpertise:"ليزر: خبرة المختصة",laserCare:"ليزر: اهتمام المختصة",laserResult:"ليزر: النتيجة",laserComfort:"ليزر: الراحة",
    hasCosmeticSurgery:"جراحة تجميلية",cosResult:"جراحة: النتيجة",cosClinicAtmo:"جراحة: أجواء العيادة",cosDisinfection:"جراحة: التعقيم",cosNursing:"جراحة: التمريض",cosProcedureNote:"جراحة: ملاحظات",
    nps:"NPS",again:"ستعود",liked:"أعجبها",improve:"يحتاج تحسين",wanted:"خدمات مطلوبة",
    problem:"مشكلة",problemTxt:"وصف المشكلة",note:"ملاحظة",name:"الاسم",phone:"الهاتف",contactOk:"موافقة على التواصل"};
  var keys=["id","ts"].concat(Object.keys(JSON.parse(BLANK))).filter(function(k){return k!=="branch";});
  var rows=[keys.map(function(k){return '"'+(LBL[k]||k)+'"';}).join(",")];
  data.forEach(function(r){
    rows.push(keys.map(function(k){
      var v=Array.isArray(r[k])?r[k].join(" | "):r[k];
      if(k==="ts"&&v)v=new Date(v).toLocaleString("en-GB");
      return '"'+(String(v==null?"":v).replace(/"/g,'""'))+'"';
    }).join(","));
  });
  var blob=new Blob(["﻿"+rows.join("\n")],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="kmc_survey_"+new Date().toISOString().slice(0,10)+".csv";
  a.click();
}
function exportJSON(data){
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="kmc_survey_"+new Date().toISOString().slice(0,10)+".json";
  a.click();
}
